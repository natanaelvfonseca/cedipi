name: CEDIPI validation

on:
  pull_request:
  push:
    branches: [main, feat/cedipi-native-ai-control]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install
        run: npm ci
      - name: Unit and HTTP tests
        run: npm test
      - name: Production build
        run: npm run build
      - name: Bootstrap isolated database
        run: npm run db:bootstrap
        env:
          POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
      - name: Run all migrations on isolated PostgreSQL
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cedipi_core
      - name: Check idempotence of migrations
        run: npm run db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/cedipi_core
